<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F7F8FA">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Lina — Zero@System</title>
  <link rel="icon" href="assets/img/plogo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/lina.css">

  <!-- Existing runtime contracts (unchanged): orchestrator config, governance engine + audit ledger, Supabase anon config -->
  <script src="js/config.js"></script>
  <script src="js/governance-engine.js"></script>
  <script src="assets/js/supabase.fabric.config.js"></script>
</head>
<body>
<div id="lina-shell" class="lina-shell" data-panel="closed">

  <header class="lina-top">
    <a class="lina-brand" href="lina.html" aria-label="Zero@System ana ekran">Zero<span class="at">@</span>System</a>

    <nav aria-label="Yüzeyler">
      <ul id="lina-nav" class="lina-nav">
        <li><button type="button" data-context="general" aria-pressed="true">Chatty</button></li>
        <li><button type="button" data-context="now" aria-pressed="false">Now</button></li>
        <li><button type="button" data-context="work" aria-pressed="false">Work</button></li>
        <li><button type="button" data-context="memory" aria-pressed="false">Memory</button></li>
      </ul>
    </nav>

    <ul id="lina-nodes" class="lina-nodes" aria-label="Bağlı sistemler"></ul>
  </header>

  <aside class="lina-rail" aria-label="Bağlam">
    <section>
      <h2>Bugün</h2>
      <ul id="lina-today"></ul>
    </section>
    <section>
      <h2>Modüller</h2>
      <details>
        <summary>14 modül</summary>
        <ul id="lina-rail-modules" class="modules"></ul>
      </details>
      <p style="margin:14px 0 0"><a href="index.html">Klasik panel</a></p>
    </section>
  </aside>

  <main class="lina-stage" aria-label="Lina">
    <div id="lina-presence" class="lina-presence" data-state="idle" role="img" aria-label="Lina">
      <svg class="lina-mark" viewBox="0 0 200 200" aria-hidden="true" focusable="false">
        <circle class="ring ring-3" cx="100" cy="100" r="96"/>
        <circle class="ring ring-2" cx="100" cy="100" r="78"/>
        <circle class="ring ring-1" cx="100" cy="100" r="60"/>
        <circle class="disc" cx="100" cy="100" r="44"/>
        <text class="glyph" x="100" y="103" text-anchor="middle" dominant-baseline="middle">@</text>
        <g class="dots">
          <circle cx="30" cy="100" r="3.2"/>
          <circle cx="170" cy="100" r="3.2"/>
        </g>
        <path class="arrow" d="M152 100 H184 M174 90 L184 100 L174 110"/>
        <g class="badge badge--approval">
          <circle cx="146" cy="52" r="14"/>
          <text x="146" y="53" text-anchor="middle" dominant-baseline="middle">!</text>
        </g>
        <g class="badge badge--error">
          <circle cx="146" cy="52" r="14"/>
          <text x="146" y="53" text-anchor="middle" dominant-baseline="middle">!</text>
        </g>
      </svg>
    </div>

    <h1 id="lina-greeting" class="lina-greeting">Merhaba</h1>
    <p id="lina-status" class="lina-status" data-state="idle" role="status" aria-live="polite">
      <span id="lina-status-text"></span>
      <span class="lina-wave" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></span>
    </p>

    <ul id="lina-summary" class="lina-summary"></ul>
    <div id="lina-thread" class="lina-thread" aria-live="polite"></div>

    <section id="lina-approval" class="lina-approval" aria-label="Onay" hidden></section>

    <ol id="lina-states" class="lina-states" aria-label="Lina durumu"></ol>

    <div id="lina-suggest" class="lina-suggest">
      <button type="button" data-say="Bugün ne kaldı?">Bugün ne kaldı?</button>
      <button type="button" data-say="Onay bekleyenler">Onay bekleyenler</button>
      <button type="button" data-say="Ekoten durumunu göster">Ekoten üretim özetini göster</button>
      <button type="button" data-say="Son kararlar">Son kararlar</button>
    </div>
  </main>

  <div id="lina-scrim" class="lina-scrim" aria-hidden="true"></div>

  <aside id="lina-panel" class="lina-panel" aria-label="Bağlam detayı">
    <div class="lina-panel-head">
      <h2 id="lina-panel-title">Bağlam</h2>
      <button id="lina-panel-close" type="button" class="lina-panel-close" aria-label="Paneli kapat">×</button>
    </div>
    <div id="lina-panel-body" class="lina-panel-body"></div>
  </aside>

  <footer class="lina-input">
    <form id="lina-form" autocomplete="off">
      <label class="lina-icon-btn lina-attach" title="Dosya ekle">
        <span class="sr-only">Dosya ekle</span>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        <input id="lina-file" type="file" multiple>
      </label>
      <label class="sr-only" for="lina-text">Lina’ya söyle</label>
      <input id="lina-text" type="text" placeholder="Lina’ya söyle..." enterkeyhint="send">
      <button id="lina-mic" type="button" class="lina-icon-btn lina-mic" aria-label="Mikrofon" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
      </button>
    </form>
  </footer>
</div>

<script src="js/lina/lina-state.js"></script>
<script src="js/lina/lina-data.js"></script>
<script src="js/lina/lina-intent.js"></script>
<script src="js/lina/lina-voice.js"></script>
<script src="js/lina/lina-ui.js"></script>
<script src="js/lina/lina-app.js"></script>
</body>
</html>
